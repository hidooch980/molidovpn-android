name: Agent safe maintenance
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: agent-safe-maintenance
  cancel-in-progress: false
jobs:
  python-safe-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Apply safe formatting and lint fixes to agent-owned scripts
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.4
          ruff check --fix scripts/agent_ci_triage.py scripts/test_agent_ci_triage.py
          ruff format scripts/agent_ci_triage.py scripts/test_agent_ci_triage.py
          ruff check scripts/agent_ci_triage.py scripts/test_agent_ci_triage.py
      - name: Verify diagnostic behavior
        run: python -m unittest discover -s scripts -p 'test_agent_ci_triage.py' -v
      - name: Propose safe fixes for review
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.MOLIDO_AUTOMATION_TOKEN || github.token }}
          branch: bot/agent-safe-python-maintenance
          delete-branch: true
          add-paths: |
            scripts/agent_ci_triage.py
            scripts/test_agent_ci_triage.py
          commit-message: 'chore(agent): apply safe Python maintenance fixes'
          title: 'chore(agent): safe Python maintenance fixes'
          body: Automated Ruff fixes are limited to agent-owned diagnostic scripts. Unit tests run before opening this PR. Review is required; the agent never auto-merges.
