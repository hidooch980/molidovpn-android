name: Community discovery API
on:
  pull_request:
    paths:
      - "community-discovery/**"
      - ".github/workflows/community-discovery.yml"
  push:
    branches: [main, ios-molido-swiftui-packet-tunnel-scaffold]
    paths:
      - "community-discovery/**"
      - ".github/workflows/community-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-discovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: community-discovery/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py test_app.py
      - run: python -m unittest -v
