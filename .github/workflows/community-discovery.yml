name: Community discovery API
on:
  pull_request:
    paths:
      - "community-discovery/**"
      - ".github/workflows/community-discovery.yml"
  push:
    branches: [main, ios-molido-swiftui-packet-tunnel-scaffold]
    paths:
      - "community-discovery/**"
      - ".github/workflows/community-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-discovery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: community-discovery/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py test_app.py
      - run: python -m unittest -v
