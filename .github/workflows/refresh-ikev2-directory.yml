name: Refresh public IKEv2 directory

on:
  push:
    paths:
      - "scripts/refresh_ikev2_directory.py"
      - ".github/workflows/refresh-ikev2-directory.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ikev2-directory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate public provider endpoints
        run: python scripts/refresh_ikev2_directory.py
      - name: Commit changed mirror only
        run: |
          if git diff --quiet -- data/ikev2/free-servers.json; then
            echo "Directory unchanged; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ikev2/free-servers.json
          git commit -m "chore: refresh public IKEv2 directory"
          git push
