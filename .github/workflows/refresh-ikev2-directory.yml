name: Refresh public IKEv2 directory

on:
  push:
    paths:
      - "scripts/refresh_ikev2_directory.py"
      - ".github/workflows/refresh-ikev2-directory.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ikev2-directory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test IKEv2 directory parser and safety rules
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Fetch and validate public provider endpoints
        run: python scripts/refresh_ikev2_directory.py
      - name: Commit changed mirror on default branch
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/ikev2/free-servers.json; then
            echo "Directory unchanged; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ikev2/free-servers.json
          git commit -m "chore: refresh public IKEv2 directory"
          git push
      - name: Keep validation output for non-default branches
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ikev2-directory-validation
          path: data/ikev2/free-servers.json
          if-no-files-found: error
          retention-days: 7
