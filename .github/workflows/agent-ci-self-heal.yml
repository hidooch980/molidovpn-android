name: Agent CI self-heal
on:
  workflow_run:
    workflows: ["Android validation", "Android IPv4 IPv6 native packet regressions", "Smart server refresh guard", "Validate imported VPN profiles", "Agent self-check", "Transport catalog validation"]
    types: [completed]
permissions:
  actions: write
  contents: read
  issues: write
concurrency:
  group: agent-ci-self-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  inspect-and-recover:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Collect failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/failed.log" || true
          test -s "$RUNNER_TEMP/failed.log" || printf "No downloadable failed-job log was available.\n" > "$RUNNER_TEMP/failed.log"
      - name: Classify failure
        id: diagnosis
        run: |
          python scripts/agent_ci_triage.py --log "$RUNNER_TEMP/failed.log" --output "$RUNNER_TEMP/diagnosis.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          diagnosis = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "diagnosis.json").read_text()
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"retry={str(diagnosis['retry_recommended']).lower()}\n")
              output.write(f"category={diagnosis['category']}\n")
          PY
      - name: Retry transient failure once
        if: steps.diagnosis.outputs.retry == 'true' && github.event.workflow_run.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
      - name: Open diagnostic issue when code or configuration needs repair
        if: steps.diagnosis.outputs.retry != 'true' || github.event.workflow_run.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          CATEGORY: ${{ steps.diagnosis.outputs.category }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Agent CI $RUN_ID in:title" --json number --jq length)"
          if [ "$existing" != "0" ]; then echo "Existing diagnostic issue found"; exit 0; fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          diagnosis = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "diagnosis.json").read_text()
          )
          excerpt = "\n".join(diagnosis["excerpt"]) or "No matching error lines were found."
          (Path(os.environ["RUNNER_TEMP"]) / "excerpt.txt").write_text(
              excerpt, encoding="utf-8"
          )
          PY
          {
            echo "Automated diagnosis from Molido Agent"
            echo "Workflow: $RUN_NAME"
            echo "Run: $RUN_URL"
            echo "Attempt: ${{ github.event.workflow_run.run_attempt }}"
            echo "Classification: $CATEGORY"
            echo "Sanitized error excerpt:"
            cat "$RUNNER_TEMP/excerpt.txt"
            echo "No application code, signing key, credential, security policy or user data was modified automatically."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[Agent CI $RUN_ID] $CATEGORY failure in $RUN_NAME" --body-file "$RUNNER_TEMP/issue.md"
