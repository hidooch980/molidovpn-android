name: Build Molido Mesh AI Android

on:
  # Publishing is explicit: ordinary code pushes must never overwrite the same v4.0.0 tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 4.0.1)"
        required: true
        default: "4.0.1"
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # First release in the 4.x line. Bump VERSION explicitly for each subsequent release.
  VERSION_CODE: ${{ github.run_number }}
  VERSION: ${{ github.event.inputs.version || '4.0.0' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools   # the default also requests the obsolete "tools" package, which fails

      - name: NDK and CMake
        run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Rust toolchain for the core
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/aether -> target

      - name: Prebuilt Psiphon, Tor and Xray (our mirror, checksum verified)
        run: bash tools/fetch-binaries.sh
      - name: Syntax-check release tooling
        run: python3 -m py_compile tools/refresh-emergency-configs.py

      - name: Refresh and validate offline emergency configs
        run: python3 tools/refresh-emergency-configs.py 40 --strict
      - name: Signing key (preserve signing identity for existing MolidoVPN installs)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build APKs
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon \
            -PtargetAbi=arm64-v8a,armeabi-v7a \
            -PaetheryKeystore=release.keystore \
            -PmolidoVersionCode=$((400000 + VERSION_CODE)) \
            -PmolidoVersionName=$VERSION
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release tag v$VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          mkdir dist
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *arm64-v8a*)   cp "$f" dist/MolidoMeshAI-android-arm64.apk ;;
              *armeabi-v7a*) cp "$f" dist/MolidoMeshAI-android-armv7.apk ;;
              *universal*)   cp "$f" dist/MolidoMeshAI-android-universal.apk ;;
            esac
          done
          ls -la dist

      - name: Verify APK package, version and signing identity
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          for name in MolidoMeshAI-android-arm64.apk MolidoMeshAI-android-armv7.apk MolidoMeshAI-android-universal.apk; do
            test -s "dist/$name"
          done
          expected_code=$((400000 + VERSION_CODE))
          expected_cert=$(keytool -exportcert -keystore release.keystore -alias "$AETHERY_KEY_ALIAS" \
            -storepass "$AETHERY_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')
          for apk in dist/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
            actual_cert=$("$APKSIGNER" verify --print-certs "$apk" | \
              awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')
            test -n "$actual_cert"
            if [[ "$actual_cert" != "$expected_cert" ]]; then
              echo "Signing certificate mismatch in $apk" >&2
              exit 1
            fi
            "$AAPT" dump badging "$apk" | grep -F \
              "package: name='com.mobin.mobin_vpn' versionCode='$expected_code' versionName='$VERSION'"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v6
        with:
          name: molido-mesh-ai-android
          path: dist/*

      - name: Publish installable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MolidoVPN ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*.apk
          body: |
            MolidoVPN Android release ${{ env.VERSION }}.

            - Signed ARM64, ARMv7 and universal APKs.
            - SHA-256 digests are published with GitHub release assets and verified by the in-app updater.
            - Upgrade in place; do not uninstall the previous version.
