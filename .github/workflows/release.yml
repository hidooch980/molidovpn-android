name: Build Molido Mesh AI Android

on:
  # Automatically build a signed Candidate after successful Android validation on main.
  workflow_run:
    workflows: ["Android validation"]
    types: [completed]
    branches: [main]
  # Public publication remains manually gated by real-device validation.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 4.0.11)"
        required: true
        default: "4.0.11"
        type: string
      device_validation_confirmed:
        description: "Confirm real-device Wi-Fi/mobile, Kill Switch and DNS/IP leak tests passed."
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  VERSION_CODE: ${{ github.run_number }}

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Select release version and safely skip already-published versions
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VALIDATION_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VALIDATION_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          VALIDATION_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          requested_version="${REQUESTED_VERSION:-$(tr -d '[:space:]' < release-version.txt)}"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$VALIDATION_CONCLUSION" == "success" ]] || {
              echo "Android validation did not succeed; skipping Candidate build."
              exit 1
            }
            [[ "$VALIDATION_BRANCH" == "main" && "$VALIDATION_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || {
              echo "::error::Candidate builds are restricted to successful validation runs from this repository's main branch."
              exit 1
            }
            version="$requested_version"
            commit_sha="$VALIDATION_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_TYPE" != "branch" || "$REF_NAME" != "main" ]]; then
              echo "::error::Release must be dispatched from the main branch."
              exit 1
            fi
            version="$requested_version"
            commit_sha="$GITHUB_SHA"
          else
            echo "::error::Unsupported release trigger."
            exit 1
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release version: $version"
            exit 1
          }
          should_release=true
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            candidate_tag="v${version}-rc.1"
            if git ls-remote --exit-code --tags origin "refs/tags/$candidate_tag" >/dev/null 2>&1 ||
               gh release view "$candidate_tag" >/dev/null 2>&1; then
              echo "::error::$candidate_tag already exists; refusing to overwrite it."
              exit 1
            fi
          else
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1 ||
               gh release view "v$version" >/dev/null 2>&1; then
              echo "::error::v$version already exists; refusing to overwrite it."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - name: Normalize selected release version
        env:
          REQUESTED_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: NDK and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Rust toolchain for the core
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/aether -> target

      - name: Fetch pinned native binaries with checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch-binaries.sh

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.6"
          cache: false

      - name: Build pinned dnstt clients for Android ABIs (CI validation only)
        env:
          DNSTT_OUTPUT_DIR: ${{ runner.temp }}/dnstt-native
        run: |
          bash tools/build-dnstt.sh --abi arm64-v8a,armeabi-v7a
          test -s "$DNSTT_OUTPUT_DIR/arm64-v8a/libdnstt.so"
          test -s "$DNSTT_OUTPUT_DIR/armeabi-v7a/libdnstt.so"

      - name: Syntax-check release tooling
        run: python3 -m py_compile tools/refresh-emergency-configs.py

      - name: Refresh and validate offline emergency configs
        run: python3 tools/refresh-emergency-configs.py 40 --strict

      - name: Validate release version and prevent tag or release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF" = "refs/tags/v$VERSION"
            tag_commit=$(git rev-parse "refs/tags/v$VERSION^{commit}")
            test "$tag_commit" = "$GITHUB_SHA"
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Release tags must point to a commit already contained in main." >&2
              exit 1
            }
          else
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "Release tag v$VERSION already exists; refusing to overwrite it." >&2
              exit 1
            fi
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Signing key (preserve signing identity for existing MolidoVPN installs)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore || { echo "Release keystore is empty" >&2; exit 1; }

      - name: Build APKs
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testMobileReleaseUnitTest testTvReleaseUnitTest assembleMobileRelease assembleTvRelease --no-daemon --stacktrace --info --max-workers=2 \
            -PtargetAbi=arm64-v8a,armeabi-v7a \
            -PaetheryKeystore=release.keystore \
            -PmolidoVersionCode=$((400000 + VERSION_CODE)) \
            -PmolidoVersionName=$VERSION
          mkdir dist
          for f in app/build/outputs/apk/mobile/release/*.apk; do
            case "$f" in
              *arm64-v8a*)   cp "$f" dist/MolidoMeshAI-android-arm64.apk ;;
              *armeabi-v7a*) cp "$f" dist/MolidoMeshAI-android-armv7.apk ;;
              *universal*)   cp "$f" dist/MolidoMeshAI-android-universal.apk ;;
            esac
          done
          for f in app/build/outputs/apk/tv/release/*.apk; do
            case "$f" in
              *arm64-v8a*) cp "$f" dist/MolidoMeshAI-android-tv-arm64.apk ;;
              *universal*) cp "$f" dist/MolidoMeshAI-android-tv-universal.apk ;;
            esac
          done
          for name in MolidoMeshAI-android-arm64.apk MolidoMeshAI-android-armv7.apk MolidoMeshAI-android-universal.apk MolidoMeshAI-android-tv-arm64.apk MolidoMeshAI-android-tv-universal.apk; do
            test -s "dist/$name"
          done

      - name: Verify APK package, version and signing identity
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          expected_code=$((400000 + VERSION_CODE))
          expected_cert=$(keytool -exportcert -keystore release.keystore -alias "$AETHERY_KEY_ALIAS" \
            -storepass "$AETHERY_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')

          baseline_url="https://github.com/hidooch980/molidovpn-android/releases/download/v4.0.0/MolidoMeshAI-android-arm64.apk"
          curl --fail --location --retry 3 --silent --show-error "$baseline_url" -o baseline-v4.0.0.apk
          "$APKSIGNER" verify --verbose baseline-v4.0.0.apk
          baseline_cert=$("$APKSIGNER" verify --print-certs baseline-v4.0.0.apk | \
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')
          test -n "$baseline_cert"
          if [[ "$baseline_cert" != "$expected_cert" ]]; then
            echo "Configured keystore does not match the published v4.0.0 signing certificate; refusing upgrade release." >&2
            exit 1
          fi
          "$AAPT" dump badging baseline-v4.0.0.apk | grep -F "package: name='com.mobin.mobin_vpn'"

          # Verify the immediately previous public release (v4.0.10) as the upgrade baseline.
          current_url="https://github.com/hidooch980/molidovpn-android/releases/download/v4.0.10/MolidoMeshAI-android-arm64.apk"
          curl --fail --location --retry 3 --silent --show-error "$current_url" -o baseline-v4.0.10.apk
          "$APKSIGNER" verify --verbose baseline-v4.0.10.apk
          current_cert=$("$APKSIGNER" verify --print-certs baseline-v4.0.10.apk | \
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')
          test -n "$current_cert"
          if [[ "$current_cert" != "$expected_cert" ]]; then
            echo "Configured keystore does not match the published v4.0.10 signing certificate; refusing upgrade release." >&2
            exit 1
          fi
          current_badging=$("$AAPT" dump badging baseline-v4.0.10.apk)
          grep -F "package: name='com.mobin.mobin_vpn'" <<< "$current_badging"
          grep -F "versionName='4.0.10'" <<< "$current_badging"
          current_code=$(sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" <<< "$current_badging" | head -n1)
          test -n "$current_code"
          if (( expected_code <= current_code )); then
            echo "New APK versionCode must be greater than the published v4.0.10 baseline." >&2
            exit 1
          fi

          # Keep the pre-4.x stable upgrade path intact as well. v3.3.60 is
          # the oldest published APK in this repository's current release history.
          legacy_url="https://github.com/hidooch980/molidovpn-android/releases/download/v3.3.60/MolidoMeshAI-android-arm64.apk"
          curl --fail --location --retry 3 --silent --show-error "$legacy_url" -o baseline-v3.3.60.apk
          "$APKSIGNER" verify --verbose baseline-v3.3.60.apk
          legacy_cert=$("$APKSIGNER" verify --print-certs baseline-v3.3.60.apk | \
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')
          test -n "$legacy_cert"
          if [[ "$legacy_cert" != "$expected_cert" ]]; then
            echo "Configured keystore does not match the published v3.3.60 legacy signing certificate; refusing upgrade release." >&2
            exit 1
          fi
          legacy_badging=$("$AAPT" dump badging baseline-v3.3.60.apk)
          grep -F "package: name='com.mobin.mobin_vpn'" <<< "$legacy_badging"
          legacy_code=$(sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" <<< "$legacy_badging" | head -n1)
          test -n "$legacy_code"
          if (( expected_code <= legacy_code )); then
            echo "New APK versionCode must be greater than the published v3.3.60 baseline." >&2
            exit 1
          fi

          tv_apk=dist/MolidoMeshAI-android-tv-universal.apk
          "$AAPT" dump badging "$tv_apk" | grep -F "uses-feature: name='android.software.leanback'"
          "$AAPT" dump xmltree "$tv_apk" AndroidManifest.xml | grep -F 'android.intent.category.LEANBACK_LAUNCHER'
          if "$AAPT" dump xmltree dist/MolidoMeshAI-android-universal.apk AndroidManifest.xml | grep -Fq 'android.intent.category.LEANBACK_LAUNCHER'; then
            echo "Phone APK must not register as an Android TV launcher app" >&2
            exit 1
          fi
          for apk in dist/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
            actual_cert=$("$APKSIGNER" verify --print-certs "$apk" | \
              awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')
            test -n "$actual_cert"
            if [[ "$actual_cert" != "$expected_cert" ]]; then
              echo "Signing certificate mismatch in $apk" >&2
              exit 1
            fi
            "$AAPT" dump badging "$apk" | grep -F \
              "package: name='com.mobin.mobin_vpn' versionCode='$expected_code' versionName='$VERSION'"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v6
        with:
          name: molido-mesh-ai-android
          path: dist/*

      - name: Publish signed Candidate prerelease (automatic after all CI gates)
        if: ${{ github.event_name == 'workflow_run' || github.event.inputs.device_validation_confirmed == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_run' && format('v{0}-rc.1', env.VERSION) || format('v{0}', env.VERSION) }}
          name: MolidoVPN ${{ env.VERSION }}
          target_commitish: ${{ needs.prepare.outputs.commit_sha }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_run' }}
          make_latest: ${{ github.event_name != 'workflow_run' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            ${{ github.event_name == 'workflow_run' && 'AUTOMATED CANDIDATE — real-device validation is still required before stable promotion.' || 'Stable MolidoVPN Android release.' }}

            MolidoVPN Android build ${{ env.VERSION }}.

            - Signed phone ARM64, ARMv7 and universal APKs.
            - Signed Android TV ARM64 and universal APKs with Leanback launcher support.
            - SHA-256 digests are published with GitHub release assets and verified by the in-app updater.
            - Server catalog refresh and Agent Hub reliability improvements.
            - Transport capability audit and compatibility test gates; unvalidated transports remain disabled.
            - Upgrade in place; do not uninstall the previous version.
