name: Validate imported VPN profiles

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/protocol-profiles.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/protocol-profiles.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: profile-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Fetch existing verified engine dependencies
        run: bash tools/fetch-binaries.sh
      - name: Fetch Xray host validator matching the recorded Android core
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path('.github/core-versions.json').read_text())['components']['xray']['applied']
          # Keep this allowlist and digest in sync with the Android core update.
          if version != 'v26.10.31':
              raise SystemExit(f'No verified Linux host-validator checksum for Android Xray {version}')
          print(version)
          PY
          )
          SHA256="e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214"
          mkdir -p "$RUNNER_TEMP/molido-xray"
          curl -fsSL --retry 3 --max-time 120 \
            "https://github.com/XTLS/Xray-core/releases/download/$VERSION/Xray-linux-64.zip" \
            -o "$RUNNER_TEMP/molido-xray/engine.zip"
          echo "$SHA256  $RUNNER_TEMP/molido-xray/engine.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/molido-xray/engine.zip" -d "$RUNNER_TEMP/molido-xray"
          chmod +x "$RUNNER_TEMP/molido-xray/xray"
          echo "MOLIDO_XRAY=$RUNNER_TEMP/molido-xray/xray" >> "$GITHUB_ENV"
      - name: Fetch pinned host engine for real Hysteria2 config validation
        run: |
          mkdir -p "$RUNNER_TEMP/molido-singbox"
          curl -fsSL --retry 3 --max-time 120 \
            https://github.com/SagerNet/sing-box/releases/download/v1.12.25/sing-box-1.12.25-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/molido-singbox/engine.tar.gz"
          echo "a1ec76e2b6b139eb747a1b1ebee7d14b8d4be5a833596cad8070a31ef960301f  $RUNNER_TEMP/molido-singbox/engine.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/molido-singbox/engine.tar.gz" -C "$RUNNER_TEMP/molido-singbox"
          echo "MOLIDO_SINGBOX=$RUNNER_TEMP/molido-singbox/sing-box-1.12.25-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: Compile Android sources and run the complete unit-test suite
        run: |
          chmod +x gradlew
          ./gradlew :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest --no-daemon \
            -PtargetAbi=arm64-v8a \
            -x buildRustCoreArm64V8a \
            -x externalNativeBuildMobileRelease \
            -x externalNativeBuildTvRelease
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vpn-profile-test-results
          path: |
            app/build/reports/tests/testMobileReleaseUnitTest/
            app/build/test-results/testMobileReleaseUnitTest/
            app/build/reports/tests/testTvReleaseUnitTest/
            app/build/test-results/testTvReleaseUnitTest/
          if-no-files-found: ignore
