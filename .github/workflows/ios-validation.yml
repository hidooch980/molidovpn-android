name: iOS scaffold validation

on:
  pull_request:
    paths:
      - "ios-app/**"
      - "core/aether/**"
      - "core/quiche/**"
      - ".github/workflows/ios-validation.yml"
  push:
    branches:
      - "ios-molido-swiftui-packet-tunnel-scaffold"
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate
      - name: Build iOS Simulator targets
        working-directory: ios-app
        run: |
          xcodebuild \
            -project MolidoMeshAI.xcodeproj \
            -scheme MolidoMeshAI \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  build-rust-core:
    name: Rust core — ${{ matrix.target }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-apple-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install native build dependencies
        run: brew install cmake ninja go nasm
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/aether
      - name: Build Aether static library for Apple target
        env:
          CMAKE_GENERATOR: Ninja
        run: cargo build --manifest-path core/aether/Cargo.toml --locked --release --lib --target ${{ matrix.target }}
      - name: Verify static library artifact
        run: test -s core/aether/target/${{ matrix.target }}/release/libaether.a
