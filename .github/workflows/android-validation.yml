name: Android validation

on:
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-validation.yml"
      - ".github/workflows/release.yml"
      - "release-version.txt"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-validation.yml"
      - ".github/workflows/release.yml"
      - "release-version.txt"

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android platform, build tools, NDK and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Verify published upgrade path from oldest available Android release
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          verify_release() {
            local tag="$1" api="$2"
            local apk="$WORK/$tag.apk" meta="$WORK/$tag.json"
            curl --fail --location --silent --show-error --retry 3 \
              -H 'Accept: application/vnd.github+json' "$api" -o "$meta"
            local url digest
            url="$(jq -er '.assets[] | select(.name == "MolidoMeshAI-android-arm64.apk") | .browser_download_url' "$meta")"
            digest="$(jq -er '.assets[] | select(.name == "MolidoMeshAI-android-arm64.apk") | .digest | sub("^sha256:"; "")' "$meta")"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            curl --fail --location --silent --show-error --retry 3 "$url" -o "$apk"
            printf '%s  %s\n' "$digest" "$apk" | sha256sum --check --status
            "$APKSIGNER" verify --verbose "$apk" >/dev/null
            local cert badging package version_code
            cert="$("$APKSIGNER" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')"
            test -n "$cert"
            badging="$("$AAPT" dump badging "$apk")"
            package="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<< "$badging" | head -n1)"
            version_code="$(sed -n "s/^package:.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" <<< "$badging" | head -n1)"
            test "$package" = "com.mobin.mobin_vpn"
            test -n "$version_code"
            printf '%s|%s|%s\n' "$cert" "$version_code" "$package"
          }
          legacy="$(verify_release v3.3.60 https://api.github.com/repos/hidooch980/molidovpn-android/releases/tags/v3.3.60)"
          current="$(verify_release latest https://api.github.com/repos/hidooch980/molidovpn-android/releases/latest)"
          IFS='|' read -r legacy_cert legacy_code legacy_package <<< "$legacy"
          IFS='|' read -r current_cert current_code current_package <<< "$current"
          test "$legacy_cert" = "$current_cert" || {
            echo "::error::Latest release signing certificate differs from v3.3.60; in-place upgrade is not safe."
            exit 1
          }
          (( current_code > legacy_code )) || {
            echo "::error::Latest release versionCode must exceed the v3.3.60 baseline."
            exit 1
          }
          echo "Verified upgrade path: $legacy_package v3.3.60 (code $legacy_code) -> $current_package latest (code $current_code), same signer."

      - name: Install Rust core host-test dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y clang cmake ninja-build pkg-config libclang-dev

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core/aether -> target

      - name: Run Aether Rust core unit tests
        run: cargo test --manifest-path core/aether/Cargo.toml --locked --lib

      - name: Fetch pinned native binaries with checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch-binaries.sh

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.6"
          cache: false

      - name: Build pinned dnstt clients for Android ABIs (CI validation only)
        env:
          DNSTT_OUTPUT_DIR: ${{ runner.temp }}/dnstt-native
        run: |
          bash tools/build-dnstt.sh --abi arm64-v8a,armeabi-v7a,x86_64
          test -s "$DNSTT_OUTPUT_DIR/arm64-v8a/libdnstt.so"
          test -s "$DNSTT_OUTPUT_DIR/armeabi-v7a/libdnstt.so"
          test -s "$DNSTT_OUTPUT_DIR/x86_64/libdnstt.so"

      - name: Syntax-check release tooling
        run: python3 -m py_compile tools/refresh-emergency-configs.py

      - name: Refresh and validate offline emergency defaults
        run: python3 tools/refresh-emergency-configs.py 40 --strict

      - name: Run Android unit tests and build unsigned release APKs
        env:
          MOLIDO_SCREENS: ${{ runner.temp }}/molido-screens
        run: |
          chmod +x gradlew
          ./gradlew testMobileReleaseUnitTest testTvReleaseUnitTest assembleMobileRelease assembleTvRelease --no-daemon --max-workers=2 \
            -PtargetAbi=arm64-v8a,armeabi-v7a \
            -PmolidoVersionCode=49999 \
            -PmolidoVersionName=0.0.0-ci

      - name: Install x86_64 emulator system image
        run: |
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name molido-x86-64 --package "system-images;android-35;google_apis;x86_64" --device pixel_2

      - name: Install and launch the complete phone app on x86_64 emulator
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          EMULATOR_LOG="$RUNNER_TEMP/molido-emulator.log"
          "$ANDROID_HOME/emulator/emulator" -avd molido-x86-64 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect >"$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb logcat -d -t 2000 > "$RUNNER_TEMP/molido-emulator-logcat.txt" || true
            kill "$EMULATOR_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then break; fi
            sleep 2
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          APK="$(find app/build/outputs/apk/mobile/release -name '*x86_64*.apk' -print -quit)"
          test -s "$APK"
          adb install "$APK"
          adb shell monkey -p com.mobin.mobin_vpn 1
          sleep 12
          APP_PID="$(adb shell pidof com.mobin.mobin_vpn | tr -d '\r' | cut -d ' ' -f1)"
          test -n "$APP_PID"
          adb logcat -d --pid="$APP_PID" > "$RUNNER_TEMP/molido-app-logcat.txt"
          if grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError|NoClassDefFoundError|SIGABRT' "$RUNNER_TEMP/molido-app-logcat.txt"; then
            echo "::error::The app crashed or failed to load a native dependency on x86_64."
            exit 1
          fi
          echo "x86_64 emulator app launch passed (pid=$APP_PID)."

      - name: Upload x86_64 emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-x86_64-emulator-diagnostics
          path: |
            ${{ runner.temp }}/molido-emulator.log
            ${{ runner.temp }}/molido-emulator-logcat.txt
            ${{ runner.temp }}/molido-app-logcat.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Android TV launcher manifest
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          TV_APK=$(find app/build/outputs/apk/tv/release -name '*universal*.apk' -print -quit)
          MOBILE_APK=$(find app/build/outputs/apk/mobile/release -name '*universal*.apk' -print -quit)
          test -s "$TV_APK"
          test -s "$MOBILE_APK"
          "$AAPT" dump badging "$TV_APK" | grep -F "uses-feature: name='android.software.leanback'"
          "$AAPT" dump xmltree "$TV_APK" AndroidManifest.xml | grep -F 'android.intent.category.LEANBACK_LAUNCHER'
          if "$AAPT" dump xmltree "$MOBILE_APK" AndroidManifest.xml | grep -Fq 'android.intent.category.LEANBACK_LAUNCHER'; then
            echo "::error::Phone APK must not register as an Android TV launcher app"
            exit 1
          fi

      - name: Upload unsigned validation APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: molido-mesh-ai-android-validation
          path: |
            app/build/outputs/apk/mobile/release/*.apk
            app/build/outputs/apk/tv/release/*.apk
          if-no-files-found: error

      - name: Upload UI regression screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-ui-regression-screenshots
          path: ${{ runner.temp }}/molido-screens/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: molido-android-junit-${{ github.run_id }}
          path: |
            app/build/test-results/testMobileReleaseUnitTest/**/*.xml
            app/build/test-results/testTvReleaseUnitTest/**/*.xml
            app/build/reports/tests/testMobileReleaseUnitTest/**
            app/build/reports/tests/testTvReleaseUnitTest/**
          if-no-files-found: warn
          retention-days: 14
