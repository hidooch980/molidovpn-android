name: Personal WireGuard native import
on:
  pull_request:
    branches: [main]
    paths:
      - 'core/aether/**'
      - 'app/src/main/java/com/molido/vpn/PersonalWireGuard*'
      - '.github/workflows/personal-wireguard.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: personal-wireguard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core/aether
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libclang-dev
      - name: Test Cloudflare registration retry, fallback, and reconnect cooldown safeguards
        run: |
          cargo test --manifest-path core/aether/Cargo.toml --lib account::tests --locked
          cargo test --manifest-path core/aether/Cargo.toml --lib app::registration_cooldown_tests --locked
      - name: Compile core and test imported identity isolation
        run: cargo test --manifest-path core/aether/Cargo.toml --lib personal_wireguard --locked
