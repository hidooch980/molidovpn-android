name: Agent self-check
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/molido/vpn/MainActivity.kt'
      - 'scripts/agent_ci_triage.py'
      - 'scripts/test_agent_ci_triage.py'
      - '.github/workflows/agent-ci-self-heal.yml'
      - '.github/workflows/agent-safe-maintenance.yml'
      - '.github/workflows/agent-validation.yml'
      - 'docs/AGENT_HUB.md'
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/molido/vpn/MainActivity.kt'
      - 'scripts/agent_ci_triage.py'
      - 'scripts/test_agent_ci_triage.py'
      - '.github/workflows/agent-ci-self-heal.yml'
      - '.github/workflows/agent-safe-maintenance.yml'
      - '.github/workflows/agent-validation.yml'
      - 'docs/AGENT_HUB.md'
permissions:
  contents: read
jobs:
  agent-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.4
      - name: Lint agent diagnostic scripts
        run: ruff check scripts/agent_ci_triage.py scripts/test_agent_ci_triage.py
      - name: Run agent diagnostic unit tests
        run: python -m unittest discover -s scripts -p 'test_agent_ci_triage.py' -v
